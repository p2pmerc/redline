[package]
name = "redline-enclave"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Redline enclave: opens sealed vulnerability reports only for the parties on chain, checks pull-request merges fail-closed, and verifies sign-ins from inside an OutLayer TDX worker."

[[bin]]
name = "redline-enclave"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hkdf = "0.12"
hex = "0.4"
base64 = "0.22"
bs58 = "0.5"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
ecies = { version = "0.2", default-features = false, features = ["pure", "std"] }
libsecp256k1 = "0.7"

[target.'cfg(target_os = "wasi")'.dependencies]
wasi-http-client = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
